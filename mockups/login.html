<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Biblioteca de Alejandría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --negro: #0a0908;
      --borgona: #49111c;
      --blanco: #f2f4f3;
      --arena: #a9927d;
      --oliva: #5e503f;
      --ff-display: 'Cormorant Garamond', Georgia, serif;
      --ff-body: 'Libre Franklin', system-ui, sans-serif;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--blanco);
      color: var(--negro);
      font-family: var(--ff-body);
      position: relative;
      overflow-x: hidden;
    }

    /* ── Textura de fondo sutil ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 60px,
          rgba(94, 80, 63, .03) 60px,
          rgba(94, 80, 63, .03) 61px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 60px,
          rgba(94, 80, 63, .03) 60px,
          rgba(94, 80, 63, .03) 61px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .9rem 2.5rem;
      background: var(--negro);
      border-bottom: 3px solid var(--borgona);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      text-decoration: none;
      color: var(--blanco);
    }

    .nav-brand-icon {
      width: 32px;
      height: 32px;
      border: 2px solid var(--arena);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--ff-display);
      font-weight: 700;
      font-size: 1rem;
      color: var(--arena);
      flex-shrink: 0;
    }

    .nav-brand span {
      font-family: var(--ff-display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .03em;
    }

    .nav-links {
      display: flex;
      gap: 1.8rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--arena);
      text-decoration: none;
      font-size: .8rem;
      font-weight: 400;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: color .2s;
    }

    .nav-links a:hover { color: var(--blanco); }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeUp .6s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADER ── */
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-header .icon-lock {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.2rem;
      border: 2px solid var(--arena);
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .login-header .icon-lock svg {
      width: 24px;
      height: 24px;
      stroke: var(--borgona);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-header h1 {
      font-family: var(--ff-display);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      color: var(--borgona);
      letter-spacing: .02em;
      line-height: 1.15;
    }

    .login-header .divider {
      display: block;
      width: 60px;
      height: 3px;
      background: var(--arena);
      margin: .9rem auto 1rem;
      border-radius: 2px;
    }

    .login-header p {
      font-size: .88rem;
      color: var(--oliva);
      font-weight: 300;
      max-width: 340px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── CARD ── */
    .login-card {
      background: #fff;
      border: 1px solid rgba(169, 146, 125, .25);
      border-radius: 6px;
      padding: 2.5rem 2.8rem 2.2rem;
      box-shadow:
        0 1px 3px rgba(10, 9, 8, .04),
        0 8px 30px rgba(10, 9, 8, .06);
    }

    /* ── FORM ── */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.3rem;
    }

    .form-group label {
      font-size: .72rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--oliva);
      margin-bottom: .4rem;
    }

    .form-group label .required {
      color: var(--borgona);
      margin-left: 2px;
    }

    .form-group input {
      height: 44px;
      padding: 0 .9rem;
      border: 1px solid rgba(169, 146, 125, .35);
      border-radius: 4px;
      font-family: var(--ff-body);
      font-size: .88rem;
      color: var(--negro);
      background: var(--blanco);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      -webkit-appearance: none;
    }

    .form-group input::placeholder { color: var(--arena); opacity: .6; }

    .form-group input:focus {
      border-color: var(--borgona);
      box-shadow: 0 0 0 3px rgba(73, 17, 28, .08);
    }

    /* ── OPCIONES BAJO PASSWORD ── */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: .45rem;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--borgona);
      cursor: pointer;
    }

    .remember-row label {
      font-size: .8rem;
      color: var(--oliva);
      font-weight: 300;
      cursor: pointer;
    }

    .forgot-link {
      font-size: .8rem;
      color: var(--borgona);
      text-decoration: none;
      font-weight: 400;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }

    .forgot-link:hover { border-bottom-color: var(--borgona); }

    /* ── BOTÓN ── */
    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      height: 48px;
      background: var(--borgona);
      color: var(--blanco);
      border: none;
      border-radius: 4px;
      font-family: var(--ff-body);
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .btn-login:hover {
      background: var(--negro);
      transform: translateY(-1px);
    }

    .btn-login svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── SEPARADOR ── */
    .separator {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.6rem 0;
    }

    .separator::before,
    .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(169, 146, 125, .25);
    }

    .separator span {
      font-size: .7rem;
      color: var(--arena);
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 400;
    }

    /* ── ROLES INFO ── */
    .roles-info {
      display: flex;
      gap: .7rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.4rem;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .35rem .8rem;
      border: 1px solid rgba(169, 146, 125, .3);
      border-radius: 20px;
      font-size: .7rem;
      color: var(--oliva);
      font-weight: 400;
      letter-spacing: .04em;
    }

    .role-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .role-badge .dot--cliente { background: var(--arena); }
    .role-badge .dot--admin { background: var(--borgona); }
    .role-badge .dot--root { background: var(--negro); }

    /* ── REGISTRO LINK ── */
    .register-link {
      text-align: center;
      font-size: .82rem;
      color: var(--oliva);
      font-weight: 300;
    }

    .register-link a {
      color: var(--borgona);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }

    .register-link a:hover { border-bottom-color: var(--borgona); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 1.4rem 1.5rem;
      font-size: .72rem;
      color: var(--arena);
      letter-spacing: .04em;
      position: relative;
      z-index: 1;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      nav { padding: .8rem 1.2rem; }
      .nav-links { display: none; }

      .login-card { padding: 1.6rem 1.3rem 1.4rem; }

      .form-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- ── NAV ── -->
  <nav>
    <a href="#" class="nav-brand">
      <div class="nav-brand-icon">A</div>
      <span>Biblioteca de Alejandría</span>
    </a>
  </nav>

  <!-- ── MAIN ── -->
  <main>
    <div class="login-wrapper">

      <div class="login-header">
        <div class="icon-lock">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Iniciar Sesión</h1>
        <span class="divider"></span>
      </div>

      <form class="login-card" autocomplete="off">

        <div class="form-group">
          <label>Correo Electrónico <span class="required">*</span></label>
          <input type="email" placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
          <label>Contraseña <span class="required">*</span></label>
          <input type="password" placeholder="••••••••">
        </div>

        <div class="form-options">
          <div class="remember-row">
            <input type="checkbox" id="remember">
            <label for="remember">Recordarme</label>
          </div>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login">
          Ingresar
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

        <p class="register-link" style="margin-top: 10px;">¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>

      </form>
    </div>
  </main>

  <footer>© 2026 Biblioteca de Alejandría — Todos los derechos reservados.</footer>

</body>
</html>
